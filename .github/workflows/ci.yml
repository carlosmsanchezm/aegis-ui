name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      # TODO: Re-enable when @backstage/cli jest config is compatible with Node 20
      # The current version uses promisify(glob) which fails with glob@11
      # See: https://github.com/backstage/backstage/issues/xxxxx
      # - name: Run tests
      #   run: yarn test:all

      - name: Build
        run: yarn build:all
