name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Lint
        run: yarn lint:all

      # TODO: Re-enable tests when @backstage/cli is updated to fix Node 20 compatibility
      # The current @backstage/cli@0.34.4-next.0 jest config uses promisify(glob)
      # which is incompatible with newer glob versions. See:
      # https://github.com/backstage/backstage/issues/26644
      # - name: Run tests
      #   run: yarn test:all

      - name: Build
        run: yarn build:all
