# Build Backstage UI → ghcr.io/<owner>/aegis/ui:<sha>
name: Build images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "plugins/**"
      - "app-config*.yaml"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aegis/ui

jobs:
  build-ui:
    name: Build and push UI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${SHORT_SHA},${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${SHORT_SHA}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile.cloud
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=aegis-ui
          cache-to: type=gha,mode=max,scope=aegis-ui

      - name: Summary
        run: |
          echo "### aegis-ui" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`export UI_IMAGE=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
