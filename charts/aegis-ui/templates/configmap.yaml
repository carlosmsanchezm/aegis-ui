apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegis-ui.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegis-ui.labels" . | nindent 4 }}
data:
  # App-config overrides can be mounted as additional config files.
  # The Backstage container CMD loads app-config.yaml and app-config.production.yaml;
  # additional overrides can be layered on top via APP_CONFIG_* env vars or
  # by mounting this ConfigMap and adding --config flags.
  APP_BASE_URL: {{ .Values.env.APP_BASE_URL | quote }}
  BACKEND_BASE_URL: {{ .Values.env.BACKEND_BASE_URL | quote }}
  NODE_ENV: {{ .Values.env.NODE_ENV | default "production" | quote }}
  AEGIS_API_URL: {{ .Values.aegisPlatform.apiUrl | quote }}
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | default "5432" | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  KEYCLOAK_ISSUER: {{ include "aegis-ui.keycloak.issuer" . | quote }}
  KEYCLOAK_METADATA_URL: {{ include "aegis-ui.keycloak.metadataUrl" . | quote }}
  KEYCLOAK_JWKS_URL: {{ include "aegis-ui.keycloak.jwksUrl" . | quote }}
