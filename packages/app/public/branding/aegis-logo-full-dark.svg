<svg viewBox="30 55 140 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Triangle connecting lines - stop at circle edges -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <!-- Top line -->
    <line x1="66" y1="75" x2="134" y2="75" />
    <!-- Right to bottom - adjusted to stop at bottom circle edge -->
    <line x1="141" y1="88" x2="109" y2="141" />
    <!-- Bottom to left - adjusted to stop at bottom circle edge -->
    <line x1="91" y1="141" x2="59" y2="88" />
  </g>

  <!-- Node circles -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7">
    <circle cx="50" cy="75" r="16" />
    <circle cx="150" cy="75" r="16" />
    <circle cx="100" cy="155" r="16" />
  </g>

  <!-- Center dot -->
  <circle cx="100" cy="102" r="10" fill="#FFFFFF" />
</svg>
