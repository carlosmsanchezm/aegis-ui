# Local development configuration - points to local platform-api via port-forward
# Requires: make port-forward (forwards to localhost:10080)

backend:
  auth:
    keys:
      - secret: dev-secret
    externalAccess:
      - type: jwks
        options:
          url: https://keycloak.aegis-platform.tech/realms/aegis/protocol/openid-connect/certs
          issuer: https://keycloak.aegis-platform.tech/realms/aegis
          audience: backstage
          subjectPrefix: 'keycloak:'

auth:
  session:
    secret: dev-session-secret
    cookie:
      secure: false
      sameSite: lax
      domain: localhost
  providers:
    keycloak:
      development:
        clientId: backstage
        clientSecret: local-backstage-client-secret
        issuer: https://keycloak.aegis-platform.tech/realms/aegis
        metadataUrl: https://keycloak.aegis-platform.tech/realms/aegis/.well-known/openid-configuration
        additionalScopes:
          - offline_access
        callbackUrl: http://localhost:7008/api/auth/keycloak/handler/frame
        prompt: login
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail
            - resolver: emailLocalPartMatchingUserEntityName

proxy:
  endpoints:
    '/aegis':
      target: 'http://localhost:10080'
      changeOrigin: true
      credentials: forward
      allowedHeaders:
        - authorization
        - Authorization
